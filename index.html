<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css"/>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Hello, world!</title>
  </head>
  <body>
    <div class="container">
        <div class="card" style="text-align:center"><h5>memory-game</h5>
            <div class="card-header"> 
                <div class="card-body"> 
                    <input class="form-control-sm" id="sizeGrid">
                    <button type="submit" class="btn btn-primary mb-1" 
                    id="createGrid" onclick="createGridButton()">createGrid</button>
                    <br>
                    <ul class="pagination justify-content-center"></ul>
                    <div id="container"></div>
                    <div class="card" id="flipCard">
                    <button type="button" class="gameCard" 
                    id="gameCardId" onclick="pushButton()">"🟩"</button>
                    </div>       
                </div>
            </div>
        </div>      
    </div>
   <script>   
    function createGridButton() {
        document.getElementById("createGrid");
    }  
    function pushButton() {
        document.getElementById("gameCardId");
    } 
   </script>
   <script src="https://cdn.jsdelivr.net/npm/sat@0.9.0/SAT.min.js"></script>  
   <script src="script.js"></script> 
  </body>
</html>
